name: temp-oda-package

on:
  push:
    paths:
      - '.github/workflows/temp-oda-package.yml'

jobs:
  fetch-oda:
    runs-on: ubuntu-latest
    steps:
      - name: Download ODA File Converter
        shell: bash
        run: |
          set -euo pipefail
          wget -q --show-progress "https://www.opendesign.com/guestfiles/get?filename=ODAFileConverter_QT6_lnxX64_8.3dll_27.1.deb" -O /tmp/oda.deb
          test -s /tmp/oda.deb
          file /tmp/oda.deb
          sha256sum /tmp/oda.deb
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: oda-file-converter-deb
          path: /tmp/oda.deb
          if-no-files-found: error
          retention-days: 1
